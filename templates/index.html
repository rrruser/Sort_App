<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソートアルゴリズム＆流れ図ビジュアルアナライザー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="app-header">
        <h1>ソートアルゴリズム＆流れ図ビジュアライザ</h1>
    </header>

    <div class="main-container">
        <!-- 左サイドバー -->
        <aside class="sidebar">
            <h2>設定</h2>

            <div class="form-group">
                <label for="algoSelect">ソートアルゴリズム</label>
                <select id="algoSelect">
                    <option value="bubble">バブルソート (Bubble Sort)</option>
                    <option value="selection">選択ソート (Selection Sort)</option>
                    <option value="insertion">挿入ソート (Insertion Sort)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="speedRange">通常アニメーション速度 (秒)</label>
                <input type="range" id="speedRange" min="0.1" max="2.0" step="0.1" value="0.5">
                <span id="speedVal">0.5s</span>
            </div>

            <div class="form-group">
                <label for="arrayInput">初期配列（カンマ区切り）</label>
                <input type="text" id="arrayInput" value="64, 34, 25, 12, 22">
            </div>

            <div class="form-group">
                <label>流れ図の読み込み</label>
                <div id="dropZone" class="drop-zone">
                    画像ファイルをドラッグ＆ドロップ<br>またはクリックして選択
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
                </div>
            </div>

            <button id="startBtn" class="btn-primary">ソート実行</button>
        </aside>

        <!-- メイン3カラム領域 -->
        <main class="content-area">
            <!-- 1. 左カラム: 実行状態 ＋ 流れ図 -->
            <section class="col-left">
                <h3>📌 実行状態と流れ図</h3>
                <div id="statusText" class="status-box">待機中...</div>
                <div class="image-wrapper" id="imgWrapper">
                    <canvas id="flowchartCanvas"></canvas>
                    <div id="imgPlaceholder" class="img-placeholder">
                        👈 左のサイドバーから流れ図画像をドラッグ＆ドロップしてください。
                    </div>
                </div>
            </section>

            <!-- 2. 中央カラム: 変数トレース -->
            <section class="col-mid">
                <h3>🔍 変数トレース</h3>
                <div class="trace-card">
                    <table>
                        <tr>
                            <td>ループ変数 <code class="blue">i</code></td>
                            <td id="traceI" class="val blue">-</td>
                        </tr>
                        <tr>
                            <td>ループ変数 <code class="blue">j</code></td>
                            <td id="traceJ" class="val blue">-</td>
                        </tr>
                        <tr>
                            <td>退避変数 <code class="red">save</code></td>
                            <td id="traceSave" class="val red">-</td>
                        </tr>
                        <tr>
                            <td>要素 <code>pointT(j)</code></td>
                            <td id="tracePj" class="val green">-</td>
                        </tr>
                        <tr>
                            <td>要素 <code>pointT(j+1)</code></td>
                            <td id="tracePj1" class="val green">-</td>
                        </tr>
                    </table>
                </div>
            </section>

            <!-- 3. 右カラム: ポップアップ(高さ固定) ＋ ソートアニメーション -->
            <section class="col-right">
                <h3>📊 ソートアニメーション</h3>
                <div id="popupBox" class="popup-box popup-empty">&nbsp;</div>
                <div class="canvas-container">
                    <canvas id="sortCanvas" width="500" height="360"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
